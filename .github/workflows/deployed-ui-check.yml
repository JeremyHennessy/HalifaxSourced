name: Deployed UI Verification

on:
  push:
    branches:
      - qa-polish-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-deployed-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed Halifax Sourced
        env:
          APP_URL: https://jeremyhennessy.github.io/HalifaxSourced
        run: node scripts/verify-ui.mjs

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-ui-verification
          path: artifacts/
          if-no-files-found: ignore
