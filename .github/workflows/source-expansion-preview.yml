name: Source Expansion Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-expansion-preview.yml
      - data/social-platform-registry.json
      - data/reviewed-social-post-decisions.json
      - scripts/import-official-sites.mjs
      - scripts/verify-official-source-pages.mjs
      - scripts/import-structured-events.mjs
      - scripts/import-patio-directory-facts.mjs
      - scripts/import-public-special-source-leads.mjs
      - scripts/discover-first-party-sources.mjs
      - scripts/merge-first-party-history.mjs
      - scripts/sanitize-first-party-sources.mjs
      - scripts/import-first-party-feed-signals.mjs
      - scripts/import-official-page-intelligence.mjs
      - scripts/import-meta-social.mjs
      - scripts/build-recent-social-posts.mjs
      - scripts/build-reviewed-social-posts.mjs
      - scripts/build-thumbnail-candidates.mjs
      - scripts/build-thumbnail-coverage-report.mjs
      - scripts/check-thumbnail-candidates.mjs
      - scripts/check-patio-directory-facts.mjs
      - scripts/check-public-special-source-leads.mjs
      - scripts/check-expanded-sources.mjs

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve previously verified first-party relationships
        run: cp data/build/first-party-sources.json /tmp/first-party-sources.previous.json

      - name: Refresh official website signals
        env:
          OFFICIAL_SITE_LIMIT: 9999
          OFFICIAL_SITE_DELAY_MS: 120
          OFFICIAL_SITE_TIMEOUT_MS: 12000
          OFFICIAL_SITE_CONCURRENCY: 8
        run: node scripts/import-official-sites.mjs

      - name: Verify direct menu and specials pages
        env:
          SOURCE_VERIFY_DELAY_MS: 250
          SOURCE_VERIFY_PAGE_LIMIT: 300
        run: node scripts/verify-official-source-pages.mjs

      - name: Refresh structured event dates
        env:
          STRUCTURED_EVENT_PAGE_LIMIT: 180
          STRUCTURED_EVENT_PAGES_PER_RESTAURANT: 3
          STRUCTURED_EVENT_DELAY_MS: 400
        run: node scripts/import-structured-events.mjs

      - name: Refresh patio directory facts
        run: node scripts/import-patio-directory-facts.mjs

      - name: Refresh public happy-hour source leads
        run: node scripts/import-public-special-source-leads.mjs

      - name: Discover first-party feeds, social profiles, link hubs, and related links
        env:
          FIRST_PARTY_SOURCE_LIMIT: 9999
          FIRST_PARTY_SOURCE_DELAY_MS: 150
          FIRST_PARTY_SOURCE_TIMEOUT_MS: 10000
          FIRST_PARTY_SOURCE_CONCURRENCY: 10
          FIRST_PARTY_OWNED_PAGE_LIMIT: 3
          FIRST_PARTY_LINK_HUB_LIMIT: 2
        run: node scripts/discover-first-party-sources.mjs

      - name: Carry forward recent verified relationships missed by this refresh
        env:
          FIRST_PARTY_PREVIOUS_PATH: /tmp/first-party-sources.previous.json
          FIRST_PARTY_CARRY_FORWARD_MAX_DAYS: 180
        run: node scripts/merge-first-party-history.mjs

      - name: Sanitize discovered and carried profile paths
        run: node scripts/sanitize-first-party-sources.mjs

      - name: Extract official page intelligence
        env:
          PAGE_INTELLIGENCE_RESTAURANT_LIMIT: 9999
          PAGE_INTELLIGENCE_PAGE_LIMIT: 600
          PAGE_INTELLIGENCE_PAGES_PER_RESTAURANT: 6
          PAGE_INTELLIGENCE_DELAY_MS: 140
          PAGE_INTELLIGENCE_TIMEOUT_MS: 10000
          PAGE_INTELLIGENCE_CONCURRENCY: 8
        run: node scripts/import-official-page-intelligence.mjs

      - name: Pull restaurant-owned RSS and Atom signals
        env:
          FEED_PULL_LIMIT: 160
          FEED_PULL_DELAY_MS: 150
          FEED_PULL_TIMEOUT_MS: 10000
          FEED_PULL_CONCURRENCY: 10
          FEED_LOOKBACK_DAYS: 180
        run: node scripts/import-first-party-feed-signals.mjs

      - name: Pull Facebook and Instagram signals through Meta APIs
        env:
          META_GRAPH_VERSION: v25.0
          META_FB_ACCESS_TOKEN: ${{ secrets.META_FB_ACCESS_TOKEN }}
          META_IG_ACCESS_TOKEN: ${{ secrets.META_IG_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          SOCIAL_PROFILE_LIMIT: 150
          SOCIAL_POST_LIMIT: 15
          SOCIAL_LOOKBACK_DAYS: 60
          SOCIAL_PULL_DELAY_MS: 200
          SOCIAL_PULL_TIMEOUT_MS: 10000
        run: node scripts/import-meta-social.mjs

      - name: Analyze and categorize recent posts
        run: |
          node scripts/build-recent-social-posts.mjs
          node scripts/build-reviewed-social-posts.mjs

      - name: Discover source-backed thumbnail candidates
        env:
          THUMBNAIL_DISCOVERY_FETCH: 1
          THUMBNAIL_DISCOVERY_PAGE_LIMIT: 320
          THUMBNAIL_DISCOVERY_PAGES_PER_RESTAURANT: 3
          THUMBNAIL_DISCOVERY_DELAY_MS: 120
          THUMBNAIL_DISCOVERY_TIMEOUT_MS: 9000
        run: node scripts/build-thumbnail-candidates.mjs

      - name: Validate source datasets
        run: |
          node scripts/check-data-integrity.mjs
          node scripts/check-expanded-sources.mjs
          node scripts/check-thumbnail-candidates.mjs
          node scripts/check-patio-directory-facts.mjs
          node scripts/check-public-special-source-leads.mjs
          node scripts/build-thumbnail-coverage-report.mjs

      - name: Upload source expansion preview
        uses: actions/upload-artifact@v4
        with:
          name: source-expansion-preview
          path: |
            data/official-site-signals.js
            data/build/official-site-signals.json
            data/verified-source-pages.js
            data/build/verified-source-pages.json
            data/structured-events.js
            data/build/structured-events.json
            data/patio-directory-facts.js
            data/build/patio-directory-facts.json

            data/public-special-source-leads.js
            data/build/public-special-source-leads.json
            data/first-party-sources.js
            data/build/first-party-sources.json
            data/website-feed-signals.js
            data/build/website-feed-signals.json
            data/website-page-intelligence.js
            data/build/website-page-intelligence.json
            data/social-signals.js
            data/build/social-signals.json
            data/recent-social-posts.js
            data/build/recent-social-posts.json
            data/reviewed-social-posts.js
            data/build/reviewed-social-posts.json
            data/thumbnail-candidates.js
            data/build/thumbnail-candidates.json
            data/build/thumbnail-coverage-report.json
            docs/thumbnail-coverage-report.md
            artifacts/data-integrity-report.json
            artifacts/expanded-source-integrity-report.json
            artifacts/thumbnail-candidates-report.json
            artifacts/thumbnail-coverage-report.json
            artifacts/patio-directory-facts-report.json
            artifacts/public-special-source-leads-report.json
          if-no-files-found: error
          retention-days: 30
