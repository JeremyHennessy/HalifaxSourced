name: Structured Events Preview

on:
  workflow_dispatch:
  push:
    branches:
      - structured-events-preview-run
    paths:
      - .github/workflows/structured-events-preview.yml
      - scripts/import-structured-events.mjs

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract structured events from official pages
        env:
          STRUCTURED_EVENT_PAGE_LIMIT: 180
          STRUCTURED_EVENT_PAGES_PER_RESTAURANT: 3
          STRUCTURED_EVENT_DELAY_MS: 400
        run: node scripts/import-structured-events.mjs

      - name: Validate generated data
        run: node scripts/check-data-integrity.mjs

      - name: Upload structured event preview
        uses: actions/upload-artifact@v4
        with:
          name: structured-events-preview
          path: |
            data/structured-events.js
            data/build/structured-events.json
            artifacts/data-integrity-report.json
          if-no-files-found: error

      - name: Commit validated preview output to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/structured-events.js data/build/structured-events.json
          if git diff --cached --quiet; then
            echo "No structured event data changes to commit."
            exit 0
          fi
          git commit -m "Capture validated structured events preview output"
          git push origin HEAD:structured-events-preview-run
