name: Mini-map Race Fix Diagnostic

on:
  push:
    branches:
      - fix/explore-minimap-canvas-race-20260828
    paths:
      - app-init.js
      - .github/workflows/minimap-race-fix-diagnostic.yml

permissions:
  contents: read

jobs:
  ui-repeat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1

      - name: Run full UI verification attempt ${{ matrix.attempt }}
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/verify-ui.mjs
