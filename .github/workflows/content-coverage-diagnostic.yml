name: Content Coverage Diagnostic

on:
  push:
    branches:
      - phase-a/content-coverage-baseline-20260828
    paths:
      - scripts/build-content-coverage-report.mjs
      - .github/workflows/content-coverage-diagnostic.yml

permissions:
  contents: write

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: phase-a/content-coverage-baseline-20260828
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build content coverage report
        run: node scripts/build-content-coverage-report.mjs
      - name: Preserve exact production baseline commit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/build/content-coverage-report.json')
          data = json.loads(path.read_text())
          data['productionBaselineCommit'] = 'add04dd5f30b5678071ce55745d568b0146b6df2'
          path.write_text(json.dumps(data, indent=2) + '\n')
          doc = Path('docs/content-coverage-report.md')
          text = doc.read_text()
          text = text.replace('Generated:', 'Production baseline: `add04dd5f30b5678071ce55745d568b0146b6df2`\n\nGenerated:', 1)
          doc.write_text(text)
          PY
      - name: Commit generated baseline snapshot
        run: |
          git config user.name "Halifax Sourced Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/build/content-coverage-report.json docs/content-coverage-report.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record content coverage baseline"
          git push origin HEAD:phase-a/content-coverage-baseline-20260828
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: content-coverage-diagnostic
          path: |
            data/build/content-coverage-report.json
            docs/content-coverage-report.md
          if-no-files-found: error
          retention-days: 7
