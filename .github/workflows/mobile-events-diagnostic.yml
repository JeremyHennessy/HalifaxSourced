name: Mobile Events Diagnostic

on:
  push:
    branches:
      - diag/mobile-events-overflow-20260828

jobs:
  diagnose-mobile-events:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1

      - name: Diagnose mobile events overflow
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/diagnose-mobile-events.mjs

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-events-diagnostic
          path: artifacts/
          if-no-files-found: error
