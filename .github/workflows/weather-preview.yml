name: ECCC Halifax Weather Preview (Review Required)
on:
  workflow_dispatch:
    inputs:
      initialize_review_cache:
        description: "Initialize only the genuine first run; never resets prior cache or holds"
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: halifax-weather-review-cache
  cancel-in-progress: false
jobs:
  preview:
    # Never restore privileged review state or fetch sources from PR branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEATHER_INITIALIZE_REVIEW_CACHE: ${{ inputs.initialize_review_cache == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline contract, cache and run-lineage tests
        run: |
          node scripts/test-weather.mjs
          node scripts/test-weather-operations.mjs
          node scripts/test-weather-run-lineage.mjs
      - name: Validate accepted snapshot
        run: node scripts/check-weather.mjs
      - name: Verify current run and exact sequential predecessor with public GitHub metadata
        id: lineage
        run: node scripts/weather-preview-lineage.mjs plan
      - name: Restore only the exact successful predecessor payload
        if: steps.lineage.outputs.bootstrap == 'false'
        id: review-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/weather-preview.json
          key: ${{ steps.lineage.outputs.predecessor-cache-key }}
          fail-on-cache-miss: true
      - name: Restore only that predecessor's final receipt
        if: steps.lineage.outputs.bootstrap == 'false'
        id: final-receipt
        uses: actions/cache/restore@v4
        with:
          path: artifacts/weather-preview-final.json
          key: ${{ steps.lineage.outputs.predecessor-cache-key }}-final
          fail-on-cache-miss: true
      - name: Verify receipt and digest before any weather or source request
        id: collect
        env:
          WEATHER_PAYLOAD_CACHE_HIT: ${{ steps.review-cache.outputs.cache-hit }}
          WEATHER_PAYLOAD_CACHE_KEY: ${{ steps.review-cache.outputs.cache-matched-key }}
          WEATHER_RECEIPT_CACHE_HIT: ${{ steps.final-receipt.outputs.cache-hit }}
          WEATHER_RECEIPT_CACHE_KEY: ${{ steps.final-receipt.outputs.cache-matched-key }}
        run: node scripts/weather-preview-lineage.mjs collect
      - name: Save only a completed current payload
        uses: actions/cache/save@v4
        with:
          path: artifacts/weather-preview.json
          key: ${{ steps.lineage.outputs.cache-key }}
      # cache/save can warn and exit zero. Its outcome alone is not proof of save.
      - name: Verify exact current payload cache exists after save
        id: saved-payload
        uses: actions/cache/restore@v4
        with:
          path: artifacts/weather-preview.json
          key: ${{ steps.lineage.outputs.cache-key }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Write final receipt only after collection drains and payload save is verified
        env:
          WEATHER_SAVED_CACHE_HIT: ${{ steps.saved-payload.outputs.cache-hit }}
          WEATHER_SAVED_CACHE_KEY: ${{ steps.saved-payload.outputs.cache-matched-key }}
        run: node scripts/weather-preview-lineage.mjs complete
      - name: Save final receipt separately after payload verification
        uses: actions/cache/save@v4
        with:
          path: artifacts/weather-preview-final.json
          key: ${{ steps.lineage.outputs.cache-key }}-final
      - name: Verify exact final receipt cache exists after save
        id: saved-final
        uses: actions/cache/restore@v4
        with:
          path: artifacts/weather-preview-final.json
          key: ${{ steps.lineage.outputs.cache-key }}-final
          lookup-only: true
          fail-on-cache-miss: true
      - name: Fail closed if the final receipt was not saved
        env:
          WEATHER_SAVED_CACHE_HIT: ${{ steps.saved-final.outputs.cache-hit }}
          WEATHER_SAVED_CACHE_KEY: ${{ steps.saved-final.outputs.cache-matched-key }}
        run: node scripts/weather-preview-lineage.mjs verify-final-save
      - name: Package only validated weather facts and health for separate review
        run: node scripts/package-weather-preview.mjs
      - name: Upload strict weather-only publication candidate
        uses: actions/upload-artifact@v4
        with:
          name: weather-preview
          path: artifacts/weather-publication/
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload nonpublishable review evidence even after an interrupted or denied collection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: halifax-weather-review-only
          path: |
            artifacts/weather-preview*.json
            artifacts/eccc-weather-review-journal.jsonl
            artifacts/source-access-diagnostics.jsonl
          if-no-files-found: warn
# MANUAL ONLY. No broad fallback, v2 migration, automatic recovery or hold reset.
# N requires exact N-1 success/attempt 1 plus its exact v1 payload/final receipt.
# Cache loss, failed/cancelled/interrupted predecessor or rerun breaks the chain;
# even source requests stop. Empty API history never authorizes initialization.
# Reviewed recovery and actual bootstrap readiness require separate verification.
# No active schedule, write token, direct publication, AI/model calls or deployment.
# After reviewed bootstrap + exact successor verification, proposed cadence: 17 * * * *.
# Source registry remains disabled. No fallback/reset/recovery input is exposed.
