name: Content Quality Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 3"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/content-quality-audit.yml
      - scripts/check-source-links.mjs
      - scripts/check-release-link-health.mjs
      - scripts/lib/link-access-policy.mjs
      - scripts/lib/source-access-state.mjs
      - scripts/lib/link-health-urls.mjs
      - scripts/lib/link-health-report.mjs
      - scripts/lib/validate-link-health.mjs
      - scripts/lib/fetch-public-source.mjs
      - scripts/test-link-access-holds.mjs
      - scripts/test-link-audit-freshness.mjs
      - scripts/lib/deny-source-network.mjs
      - data/source-link-access-holds.json
      - scripts/build-content-quality-report.mjs
      - scripts/reconcile-structured-coverage.mjs
      - scripts/build-structured-specials.mjs
      - data/build/first-party-sources.json
      - data/build/structured-place-facts.json
      - data/build/city-events.json

permissions:
  contents: read

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate link access policy without source requests
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/lib/deny-source-network.mjs
        run: |
          node scripts/test-link-audit-freshness.mjs
          node scripts/test-link-access-holds.mjs

  audit:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the reviewed canonical catalog
        run: node scripts/export-catalog.mjs
      - name: Build deterministic structured specials
        run: |
          node scripts/build-structured-specials.mjs
          node scripts/check-structured-specials.mjs
      - name: Audit source link health
        env:
          LINK_HEALTH_SCOPE: release
          LINK_HEALTH_LIMIT: 0
          LINK_HEALTH_TIMEOUT_MS: 4000
          LINK_HEALTH_CONCURRENCY: 16
        run: |
          node scripts/check-source-links.mjs
          node scripts/check-release-link-health.mjs
      - name: Preserve access-hold diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-link-access-diagnostics
          path: |
            artifacts/source-link-health-report.json
            artifacts/source-access-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - name: Rebuild reconciled content quality report
        run: |
          node scripts/check-restaurant-lifecycle.mjs
          node scripts/build-content-coverage-report.mjs
          node scripts/reconcile-structured-coverage.mjs
          node scripts/check-report-deployment-parity.mjs
          node scripts/build-content-quality-report.mjs
      - name: Upload quality audit
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-audit
          path: |
            artifacts/source-link-health-report.json
            artifacts/structured-specials-report.json
            data/build/structured-specials.json
            data/build/content-coverage-report.json
            data/build/content-quality-report.json
            docs/content-coverage-report.md
            docs/content-quality-report.md
          if-no-files-found: error
          retention-days: 30
