name: Promote Preview Artifacts

on:
  workflow_run:
    workflows:
      - Source Expansion Preview
      - City Events Preview
      - Social Source Preview
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read-only reconciliation report; do not create branches or pull requests.
        required: false
        type: boolean
        default: false
      run_id:
        description: Workflow run ID containing the preview artifact to promote.
        required: true
        type: string
      artifact_name:
        description: Preview artifact name to promote.
        required: true
        type: choice
        options:
          - source-expansion-preview
          - city-events-preview
          - social-source-preview

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: preview-artifact-promotion
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile retained preview queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request' &&
        (github.event.workflow_run.name != 'City Events Preview' || github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - name: Checkout coordinator from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up coordinator Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reconcile all retained lanes
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
          REQUESTED_ARTIFACT: ${{ inputs.artifact_name }}
          PLAN_PATH: ${{ runner.temp }}/preview-queue-plan.json
        run: node scripts/coordinate-preview-updates.mjs
      - name: Preserve queue decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-queue-plan
          path: ${{ runner.temp }}/preview-queue-plan.json
          if-no-files-found: warn
          retention-days: 30

  promote:
    name: Promote ${{ matrix.artifact_name }} (source ${{ matrix.run_id }})
    needs: reconcile
    if: needs.reconcile.outputs.has_work == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.reconcile.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve preview artifact
        id: preview
        env:
          RUN_ID: ${{ matrix.run_id }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          WORKFLOW_NAME: ${{ matrix.workflow_name }}
          SOURCE_RUN_URL: ${{ matrix.source_run_url }}
        shell: bash
        run: |
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "workflow_name=$WORKFLOW_NAME" >> "$GITHUB_OUTPUT"
          echo "source_run_url=$SOURCE_RUN_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recheck live review reservation
        id: reservation
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ matrix.run_id }}
          REQUESTED_ARTIFACT: ${{ matrix.artifact_name }}
          PLAN_PATH: ${{ runner.temp }}/preview-reservation.json
        shell: bash
        run: |
          node scripts/coordinate-preview-updates.mjs --guard
          checked_main="$(node -p "JSON.parse(require('fs').readFileSync(process.env.PLAN_PATH)).mainSha")"
          test "$(git rev-parse HEAD)" = "$checked_main" || { echo "::error::Main advanced after checkout; retry reconciliation, never restore an old code tree."; exit 1; }

      - name: Download preview artifact
        if: steps.reservation.outputs.allowed == 'true'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.preview.outputs.run_id }}
          name: ${{ steps.preview.outputs.artifact_name }}
          path: ${{ runner.temp }}/preview-artifact

      - name: Promote allowlisted data files
        if: steps.reservation.outputs.allowed == 'true'
        env:
          PROMOTION_RESULT_PATH: ${{ runner.temp }}/promotion-result.json
          ARTIFACT_DIR: ${{ runner.temp }}/preview-artifact
          ARTIFACT_NAME: ${{ steps.preview.outputs.artifact_name }}
          ARTIFACT_RUN_ID: ${{ steps.preview.outputs.run_id }}
          SOURCE_WORKFLOW_NAME: ${{ steps.preview.outputs.workflow_name }}
          SOURCE_WORKFLOW_RUN_URL: ${{ steps.preview.outputs.source_run_url }}
          SOURCE_RUN_CREATED_AT: ${{ matrix.source_run_created_at }}
        run: |
          BASE_COMMIT_SHA="$(git rev-parse HEAD)" node scripts/promote-preview-artifacts.mjs

      - name: Detect promoted data changes
        if: steps.reservation.outputs.allowed == 'true'
        id: changes
        shell: bash
        run: |
          git status --short
          data_status="$(git status --porcelain -- data ':!data/build/preview-promotion-metadata.json')"
          if [ -z "$data_status" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No promoted data changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$data_status"
            git diff --stat -- data ':!data/build/preview-promotion-metadata.json'
          fi

      - name: Commit promoted data
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          artifact_name="${{ steps.preview.outputs.artifact_name }}"
          branch="$(node scripts/preview-branch-policy.mjs target "$artifact_name")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          expected_sha="${{ steps.reservation.outputs.expected_sha }}"
          actual_sha=""
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" > "$RUNNER_TEMP/promotion-ref"; then
            actual_sha="$(cut -f1 "$RUNNER_TEMP/promotion-ref")"
          else
            ref_status=$?
            test "$ref_status" -eq 2 || exit "$ref_status"
          fi
          test "$actual_sha" = "$expected_sha" || { echo "::error::Promotion reservation changed; no branch was replaced."; exit 1; }
          if [ -n "$expected_sha" ]; then
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
            test "$expected_sha" = "$(git rev-parse "refs/remotes/origin/$branch")" || { echo "::error::Promotion ref changed during fetch"; exit 1; }
            if ! git merge-base --is-ancestor "$expected_sha" HEAD; then
              released_sha="${{ steps.reservation.outputs.released_sha }}"
              test -n "$released_sha" && test "$released_sha" = "$expected_sha" || { echo "::error::Unmerged owner branch is reserved; refusing overwrite."; exit 1; }
            fi
          fi
          # A second read catches a review opened after the planner. Neither an
          # existing PR nor its owner branch is ever edited by this job.
          heads="$(gh pr list --base main --state open --json headRefName --jq '.[].headRefName')"
          reserved_heads="$(node scripts/preview-branch-policy.mjs peers "$artifact_name")"
          if printf '%s\n' "$heads" | grep -Fxf <(printf '%s\n' "$reserved_heads"); then
            echo "::error::An active review reserves this lane or its overlapping files."
            exit 1
          fi
          checked_main="$(git rev-parse HEAD)"
          remote_main="$(git ls-remote --exit-code --heads origin refs/heads/main | cut -f1)"
          test "$checked_main" = "$remote_main" || { echo "::error::Main advanced before push; no branch was replaced."; exit 1; }
          git checkout -B "$branch"
          git add data data/build

          git commit -m "Promote ${artifact_name} data preview"
          git push --force-with-lease="refs/heads/$branch:$expected_sha" origin "HEAD:refs/heads/$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update promotion pull request
        id: pull-request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PREVIEW_PROMOTION_PR_TOKEN || github.token }}
        shell: bash
        run: |
          artifact_name="${{ steps.preview.outputs.artifact_name }}"
          artifact_run_id="${{ steps.preview.outputs.run_id }}"
          branch="${{ steps.commit.outputs.branch }}"
          source_run_url="${{ steps.preview.outputs.source_run_url }}"
          title="Promote ${artifact_name} data preview"
          pr_body="$RUNNER_TEMP/pr-body.md"
          pr_error=""
          pr_url=""
          existing_pr=""
          compare_url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1"
          echo "compare_url=$compare_url" >> "$GITHUB_OUTPUT"

          cat > "$pr_body" <<BODY
          Automated promotion of the \`${artifact_name}\` preview artifact.

          Source workflow run: ${source_run_url}
          Source run ID: \`${artifact_run_id}\`
          Promoted paths: \`data/\` and \`data/build/\` allowlist only.

          This PR dispatches \`Quality Gate\` for \`${branch}\`. The existing gated Pages workflow deploys after this PR is merged and \`Quality Gate\` succeeds on \`main\`.
          BODY

          if ! existing_pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty' 2>"$RUNNER_TEMP/pr-list-error.log")"; then
            pr_error="$(cat "$RUNNER_TEMP/pr-list-error.log")"
          elif [ -n "$existing_pr" ]; then
            if ! pr_url="$(gh pr view "$existing_pr" --json url --jq '.url' 2>"$RUNNER_TEMP/pr-view-error.log")"; then
              pr_error="$(cat "$RUNNER_TEMP/pr-view-error.log")"
              pr_url=""
            fi
          else
            if gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$pr_body" >"$RUNNER_TEMP/pr-url.txt" 2>"$RUNNER_TEMP/pr-create-error.log"; then
              pr_url="$(cat "$RUNNER_TEMP/pr-url.txt")"
              existing_pr="${pr_url##*/}"
            else
              pr_error="$(cat "$RUNNER_TEMP/pr-create-error.log")"
            fi
          fi

          pr_prefix="${{ github.server_url }}/${{ github.repository }}/pull/"
          pr_number="${pr_url#"$pr_prefix"}"
          if [ "$pr_number" = "$pr_url" ] || ! [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]; then
            pr_error="${pr_error:-GitHub did not return a valid promotion pull request URL.}"
          fi

          if [ -n "$pr_error" ]; then
            echo "::warning::Could not open or update promotion PR for ${branch}: ${pr_error}"
            {
              echo "## Promotion PR action needed"
              echo ""
              echo "Promoted branch: \`${branch}\`"
              echo "Artifact: \`${artifact_name}\`"
              echo "Source workflow run: ${source_run_url}"
              echo ""
              echo "No promotion PR could be confirmed. Quality Gate will not be dispatched."
              echo ""
              echo "Review the branch and open a draft PR using existing repository access: ${compare_url}"
              echo ""
              echo "Exact blocker: ${pr_error}"
              echo "This branch now reserves the lane. Open/review its PR using existing access, then run Quality Gate for its exact head. Automatic reconciliation will not retry PR creation or overwrite the reservation."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "number=" >> "$GITHUB_OUTPUT"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=$existing_pr" >> "$GITHUB_OUTPUT"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Opened or updated PR: $pr_url"

      - name: Run Quality Gate for promotion branch
        if: steps.changes.outputs.changed == 'true' && steps.pull-request.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_PR_URL: ${{ steps.pull-request.outputs.url }}
          PROMOTION_BRANCH: ${{ steps.commit.outputs.branch }}
        shell: bash
        run: |
          # Keep the shell safe if this step is reused outside its Actions condition.
          if [ -z "$PROMOTION_PR_URL" ]; then
            echo "No promotion PR is available; skipping Quality Gate."
            exit 0
          fi
          gh workflow run "Quality Gate" --ref "$PROMOTION_BRANCH"
          echo "Dispatched Quality Gate for $PROMOTION_BRANCH."

      - name: Promotion result
        if: steps.changes.outputs.changed == 'true'
        run: |
          if [ -n "${{ steps.pull-request.outputs.url }}" ]; then
            echo "Promotion PR: ${{ steps.pull-request.outputs.url }}"
          else
            echo "Promotion branch: ${{ steps.commit.outputs.branch }}"
            echo "Promotion PR was not confirmed; Quality Gate was skipped. Review and open a draft PR: ${{ steps.pull-request.outputs.compare_url }}"
          fi
          echo "Pages deploy remains gated by the main-branch Quality Gate after merge."

      - name: Require promotion pull request
        if: steps.changes.outputs.changed == 'true' && steps.pull-request.outputs.url == ''
        run: |
          echo "::error::Promoted data is available on the branch, but no promotion PR was confirmed. Quality Gate was skipped. Review and open a draft PR: ${{ steps.pull-request.outputs.compare_url }}"
          exit 1

      - name: Preserve promotion attempt receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-attempt-receipt-${{ matrix.artifact_name }}
          path: ${{ runner.temp }}/promotion-result.json
          if-no-files-found: warn
          retention-days: 30
