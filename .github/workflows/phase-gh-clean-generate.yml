name: Phase GH Clean Generate

on:
  push:
    branches:
      - phase-gh-clean/event-entities-20260828
    paths:
      - .github/workflows/phase-gh-clean-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-gh-clean/event-entities-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve committed validated event dataset
        run: node scripts/resolve-city-event-entities.mjs
      - name: Validate event scope and entity relationships
        run: |
          node scripts/check-city-events.mjs
          node scripts/check-event-entity-resolution.mjs
      - name: Record generation evidence and remove generator
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const city=JSON.parse(fs.readFileSync('data/build/city-events.json','utf8'));
          const resolution=JSON.parse(fs.readFileSync('data/build/event-entity-resolution.json','utf8'));
          const candidates=JSON.parse(fs.readFileSync('data/event-source-candidates.json','utf8'));
          if((city.events||[]).length!==166) throw new Error(`Expected committed event count to remain 166, got ${(city.events||[]).length}`);
          const alderney=(candidates.candidates||[]).find(x=>x.id==='alderney-landing');
          if(!alderney || alderney.status!=='blocked_pending_adapter') throw new Error('Alderney blocker record missing');
          const record={generatedAt:new Date().toISOString(),sourceCommit:process.env.GITHUB_SHA,eventCount:city.events.length,venueResolved:resolution.venueResolved||0,organizerResolved:resolution.organizerResolved||0,restaurantResolved:resolution.restaurantResolved||0,blockedAlderney:true};
          fs.writeFileSync('data/build/phase-gh-generation.json',JSON.stringify(record,null,2)+'\n');
          console.log(JSON.stringify(record,null,2));
          NODE
          git config user.name "Halifax Sourced Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/city-events.js data/build/city-events.json data/build/event-entity-resolution.json data/build/phase-gh-generation.json
          git rm .github/workflows/phase-gh-clean-generate.yml
          git commit -m "Generate reviewed event entity relationships"
          git push origin HEAD:phase-gh-clean/event-entities-20260828
