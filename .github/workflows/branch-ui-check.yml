name: Branch UI Verification

on:
  push:
    branches:
      - qa-polish-20260828
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-branch-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          echo $! > /tmp/halifax-sourced-server.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1

      - name: Verify branch UI
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/verify-ui.mjs

      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-ui-verification
          path: artifacts/
          if-no-files-found: ignore
