name: Promote Source Expansion Artifact

# Retained only so bookmarked/manual callers receive an explicit migration
# notice. It must not provide a second writer or bypass canonical validation.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact Source Expansion Preview run ID for the canonical workflow.
        required: true
        type: string
      artifact_name:
        description: Use source-expansion-preview in Promote Preview Artifacts.
        required: false
        default: source-expansion-preview
        type: string

permissions:
  contents: read

concurrency:
  group: preview-artifact-promotion
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Use the canonical promotion workflow
        run: |
          echo "::error::This legacy writer is retired. Run Promote Preview Artifacts with your exact run_id and artifact_name=source-expansion-preview. It validates provenance, retained artifacts, semantic changes and review reservations. No data, branch or pull request was changed."
          exit 1
