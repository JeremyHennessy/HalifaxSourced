name: Restaurant Discovery Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "43 10 * * *"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - scripts/**
      - data/**
      - app-media.js
      - source-integrity.js
      - restaurant-corrections.js
      - app-restaurant-identity.js
      - app-inspection-matching.js

permissions:
  contents: read

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate restaurant discovery without collection
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/lib/deny-source-network.mjs
        run: |
          node --check scripts/import-directory-restaurants.mjs
          node --check scripts/import-review-directory-restaurants.mjs
          node --check scripts/review-directory-sources.mjs
          node --check scripts/refine-dartmouth-directory.mjs
          node --check scripts/import-opening-watch.mjs
          node --check scripts/lib/taste-ns-member-api.mjs
          node --check scripts/export-catalog.mjs
          node --check scripts/resolve-place-candidates.mjs
          node --check scripts/build-discovered-restaurants.mjs
          node --check scripts/check-place-source-resolution.mjs
          node --check scripts/check-restaurant-discovery.mjs
          node scripts/test-dartmouth-directory-names.mjs
          node scripts/test-taste-ns-member-api.mjs
          node scripts/test-restaurant-discovery-offline.mjs
          node scripts/test-scheduled-source-guards.mjs

  discover:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test source name decoding
        run: |
          node scripts/test-dartmouth-directory-names.mjs
          node scripts/test-taste-ns-member-api.mjs

      - name: Refresh directory restaurant candidates
        env:
          NS_TOURISM_PAGE_LIMIT: 30
          DOWNTOWN_DIRECTORY_DETAIL_LIMIT: 120
        run: node scripts/import-directory-restaurants.mjs

      - name: Refine Downtown Dartmouth directory candidates
        run: node scripts/refine-dartmouth-directory.mjs

      - name: Add review-directory discovery candidates
        run: node scripts/import-review-directory-restaurants.mjs

      - name: Resolve directory candidates to canonical places
        run: node scripts/resolve-place-candidates.mjs

      - name: Validate place source and resolution data
        run: node scripts/check-place-source-resolution.mjs

      - name: Refresh local opening watch
        env:
          OPENING_WATCH_LOOKBACK_DAYS: 180
        run: node scripts/import-opening-watch.mjs

      - name: Build approved discovery listings
        run: node scripts/build-discovered-restaurants.mjs

      - name: Validate restaurant discovery data
        run: node scripts/check-restaurant-discovery.mjs

      - name: Upload restaurant discovery preview
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-discovery-preview
          path: |
            data/directory-restaurant-leads.js
            data/build/directory-restaurant-leads.json
            data/build/place-source-resolutions.json
            data/opening-watch-leads.js
            data/build/opening-watch-leads.json
            data/discovered-restaurants.js
            data/build/discovered-restaurants.json
            artifacts/place-source-resolution-report.json
            artifacts/restaurant-discovery-report.json
          if-no-files-found: error
          retention-days: 30
