name: Structured Specials Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "37 11 * * 3"
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/structured-specials-preview.yml
      - scripts/import-public-special-source-leads.mjs
      - scripts/build-structured-specials.mjs
      - scripts/check-structured-specials.mjs
      - scripts/reconcile-structured-coverage.mjs
      - scripts/build-content-quality-report.mjs
      - app-structured-specials.js
      - data/build/catalog.json
      - data/build/first-party-sources.json
      - data/build/verified-source-pages.json
      - data/build/structured-place-facts.json

permissions:
  contents: read

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate accepted snapshots and fixtures without collection
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/lib/deny-source-network.mjs
        run: |
          node scripts/export-catalog.mjs
          node scripts/test-structured-specials-model.mjs
          node scripts/build-structured-specials.mjs
          node scripts/check-public-special-source-leads.mjs
          node scripts/check-structured-specials.mjs

  refresh:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export the reviewed canonical catalog
        run: node scripts/export-catalog.mjs
      - name: Build public happy-hour source leads
        run: node scripts/import-public-special-source-leads.mjs

      - name: Build source-backed structured specials
        run: node scripts/build-structured-specials.mjs
      - name: Validate structured specials
        run: |
          node scripts/check-public-special-source-leads.mjs
          node scripts/check-structured-specials.mjs
      - name: Build reconciled coverage and quality report
        run: |
          node scripts/check-restaurant-lifecycle.mjs
          node scripts/build-content-coverage-report.mjs
          node scripts/reconcile-structured-coverage.mjs
          node scripts/check-report-deployment-parity.mjs
          node scripts/build-content-quality-report.mjs
      - name: Upload specials and quality preview
        uses: actions/upload-artifact@v4
        with:
          name: structured-specials-preview
          path: |
            data/structured-specials.js
            data/build/structured-specials.json
            data/public-special-source-leads.js
            data/build/public-special-source-leads.json
            data/build/content-coverage-report.json
            data/build/content-quality-report.json
            docs/content-coverage-report.md
            docs/content-quality-report.md
            artifacts/structured-specials-report.json
            artifacts/public-special-source-leads-report.json
          if-no-files-found: error
          retention-days: 30
