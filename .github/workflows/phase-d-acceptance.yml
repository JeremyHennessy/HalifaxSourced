name: Phase D Acceptance

on:
  push:
    branches:
      - phase-d/social-evidence-expansion-20260828
    paths:
      - .github/workflows/phase-d-acceptance.yml

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-d/social-evidence-expansion-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Validate JavaScript and data contracts
        run: |
          for file in app-*.js scripts/*.mjs; do node --check "$file"; done
          node scripts/test-social-platform-registry.mjs
          node scripts/check-data-integrity.mjs
          node scripts/check-expanded-sources.mjs
          node scripts/check-restaurant-discovery.mjs
          node scripts/check-city-events.mjs
          node scripts/build-content-coverage-report.mjs
          node scripts/reconcile-social-coverage.mjs
      - name: Enforce Phase D coverage acceptance
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const coverage = JSON.parse(fs.readFileSync('data/build/content-coverage-report.json','utf8'));
          const firstParty = JSON.parse(fs.readFileSync('data/build/first-party-sources.json','utf8'));
          const placesWithSocial = Number(coverage.socialAudit?.placesWithSocial || 0);
          if (placesWithSocial < 132) throw new Error(`Social place coverage regressed below baseline: ${placesWithSocial} < 132`);
          const generic = [];
          const genericFirst = new Set(['p','reel','reels','stories','explore','accounts','tv','direct','share','sharer','dialog','plugins','login','groups','events','watch','photo','photos','posts','home','intent','search','i','feed','jobs','learning','shorts','playlist','results','discover','foryou','music','tag','activity','notifications','settings','pin','ideas','lens','spotlight']);
          for (const r of firstParty.records || []) for (const p of r.socialProfiles || []) {
            let u; try { u = new URL(p.profileUrl || p.url); } catch { generic.push(`${r.restaurantId}:invalid_url`); continue; }
            const first = decodeURIComponent(u.pathname.split('/').filter(Boolean)[0] || '').replace(/^@/,'').toLowerCase();
            if (genericFirst.has(first) && !(p.platform === 'snapchat' && first === 'add')) generic.push(`${r.restaurantId}:${p.platform}:${first}`);
          }
          if (generic.length) throw new Error(`Generic/content social URLs remain: ${generic.slice(0,20).join(', ')}`);
          const out = {
            acceptedAt: new Date().toISOString(),
            testedCommit: process.env.GITHUB_SHA,
            baselineSocialPlaces: 132,
            placesWithSocial,
            profileAssociations: coverage.socialAudit?.profileAssociations || 0,
            placesWithLinkHub: coverage.socialAudit?.placesWithLinkHub || 0,
            firstPartyRecords: firstParty.records?.length || 0,
            firstPartyProfiles: firstParty.profileCount || 0,
            firstPartyLinkHubs: firstParty.linkHubCount || 0,
            carryForward: firstParty.carryForward || null,
            sanitization: firstParty.sanitization || null,
            result: 'data_acceptance_passed'
          };
          fs.writeFileSync('data/build/phase-d-acceptance.json', JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Start local app
        run: |
          node scripts/dev-server.mjs >/tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1
      - name: Run full browser acceptance
        env:
          APP_URL: http://127.0.0.1:5173
        run: |
          node scripts/verify-ui.mjs
          node scripts/test-explore-minimap-lifecycle.mjs
      - name: Commit acceptance record and remove acceptance workflow
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p='data/build/phase-d-acceptance.json';
          const v=JSON.parse(fs.readFileSync(p,'utf8'));
          v.result='accepted'; v.browserAcceptance='verify-ui + mini-map lifecycle passed';
          fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          NODE
          git config user.name "Halifax Sourced Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/build/phase-d-acceptance.json
          git rm .github/workflows/phase-d-acceptance.yml
          git commit -m "Record Phase D social evidence acceptance"
          git push origin HEAD:phase-d/social-evidence-expansion-20260828
