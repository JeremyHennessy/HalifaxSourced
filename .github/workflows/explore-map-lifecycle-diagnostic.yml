name: Explore Map Lifecycle Diagnostic

on:
  push:
    branches:
      - fix/explore-mini-map-lifecycle-20260828

permissions:
  contents: read

jobs:
  targeted-lifecycle:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1
      - name: Verify Explore mini-map lifecycle
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/diagnose-explore-map-lifecycle.mjs

  full-ui-repeat:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Add Canvas lifecycle diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/verify-ui.mjs')
          text = path.read_text()
          text = text.replace(
              'page.on("console", (message) => { if (message.type() === "error") consoleErrors.push(message.text()); });\npage.on("pageerror", (error) => consoleErrors.push(error.message));',
              'page.on("console", (message) => { if (message.type() === "error") consoleErrors.push(`CONSOLE @ ${page.url()}: ${message.text()}`); });\npage.on("pageerror", (error) => consoleErrors.push(`PAGEERROR @ ${page.url()}: ${error.stack || error.message}`));'
          )
          needle = 'await page.goto(`${url}/#home`, { waitUntil: "networkidle" });'
          inject = '''await page.goto(`${url}/#home`, { waitUntil: "networkidle" });\nawait page.evaluate(() => {\n  const proto = window.L?.Canvas?.prototype;\n  if (!proto || proto.__halifaxLifecycleDiagnostic) return;\n  proto.__halifaxLifecycleDiagnostic = true;\n  const originalDestroy = proto._destroyContainer;\n  const originalClear = proto._clear;\n  proto._destroyContainer = function (...args) {\n    this.__halifaxDestroyInfo = {\n      mapId: this._map?.getContainer?.()?.id || null,\n      destroyRoute: location.hash,\n      pathCount: Object.keys(this._layers || {}).length,\n      redrawRequest: this._redrawRequest ?? null\n    };\n    return originalDestroy.apply(this, args);\n  };\n  proto._clear = function (...args) {\n    if (!this._ctx) {\n      console.error("HS_CANVAS_CLEAR_WITHOUT_CONTEXT", JSON.stringify({\n        ...(this.__halifaxDestroyInfo || {}),\n        currentRoute: location.hash,\n        mapConnected: Boolean(this._map?.getContainer?.()?.isConnected),\n        currentPathCount: Object.keys(this._layers || {}).length,\n        redrawRequest: this._redrawRequest ?? null\n      }));\n    }\n    return originalClear.apply(this, args);\n  };\n});'''
          if needle not in text:
              raise SystemExit('home navigation insertion point not found')
          text = text.replace(needle, inject, 1)
          path.write_text(text)
          PY
      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1
      - name: Run full UI verification attempt ${{ matrix.attempt }}
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/verify-ui.mjs
