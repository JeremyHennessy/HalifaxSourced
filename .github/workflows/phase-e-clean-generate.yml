name: Phase E Clean Generate

on:
  push:
    branches:
      - phase-e-clean/structured-place-facts-20260828
    paths:
      - .github/workflows/phase-e-clean-generate.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase-e-clean/structured-place-facts-20260828
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Extract structured first-party facts
        env:
          STRUCTURED_PLACE_FACT_LIMIT: 9999
          STRUCTURED_PLACE_FACT_DELAY_MS: 120
          STRUCTURED_PLACE_FACT_TIMEOUT_MS: 10000
          STRUCTURED_PLACE_FACT_CONCURRENCY: 8
        run: node scripts/import-structured-place-facts.mjs
      - name: Validate structured facts and hours semantics
        run: |
          node scripts/check-structured-place-facts.mjs
          node scripts/test-hours-state.mjs
      - name: Require observed factual coverage
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f=JSON.parse(fs.readFileSync('data/build/structured-place-facts.json','utf8'));
          for (const key of ['hours','menus','reservations','ordering']) if ((f.counts?.[key]||0)<1) throw new Error(`No structured ${key} observations produced`);
          if((f.records?.length||0)<1) throw new Error('No structured place fact records produced');
          const record={generatedAt:new Date().toISOString(),sourceCommit:process.env.GITHUB_SHA,checkedPlaces:f.checkedPlaces,sourceFailures:f.failures?.length||0,...f.counts};
          fs.writeFileSync('data/build/phase-e-generation.json',JSON.stringify(record,null,2)+'\n');
          console.log(JSON.stringify(record,null,2));
          NODE
      - name: Wire facts into runtime and permanent Quality Gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); text=p.read_text()
          if 'data/structured-place-facts.js' not in text:
              text=re.sub(r'(\s*<script src="\./data/first-party-sources\.js[^\n]*</script>)', r'\1\n    <script src="./data/structured-place-facts.js?v=20260828-structured-facts"></script>', text, count=1)
          if 'app-hours.js' not in text:
              text=re.sub(r'(\s*<script src="\./app-core\.js[^\n]*</script>)', r'\n    <script src="./app-hours.js?v=20260828-hours"></script>\1', text, count=1)
          if 'app-place-facts.js' not in text:
              text=re.sub(r'(\s*<script src="\./app-source-signals\.js[^\n]*</script>)', r'\1\n    <script src="./app-place-facts.js?v=20260828-place-facts"></script>\n    <script src="./app-place-facts-display.js?v=20260828-place-facts"></script>', text, count=1)
          p.write_text(text)
          q=Path('.github/workflows/quality-gate.yml'); qt=q.read_text()
          needle='          node scripts/check-event-entity-resolution.mjs\n'
          add='          node scripts/check-structured-place-facts.mjs\n          node scripts/test-hours-state.mjs\n'
          if 'node scripts/check-structured-place-facts.mjs' not in qt:
              if needle not in qt: raise SystemExit('Quality Gate event-entity insertion point missing')
              qt=qt.replace(needle, needle+add, 1)
          artifact='            artifacts/event-entity-resolution-report.json\n'
          if 'artifacts/structured-place-facts-report.json' not in qt:
              qt=qt.replace(artifact, artifact+'            artifacts/structured-place-facts-report.json\n            data/build/structured-place-facts.json\n',1)
          q.write_text(qt)
          PY
      - name: Start local app
        run: |
          node scripts/dev-server.mjs >/tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do curl --fail --silent http://127.0.0.1:5173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/halifax-sourced-server.log
          exit 1
      - name: Run browser acceptance
        env:
          APP_URL: http://127.0.0.1:5173
        run: |
          node scripts/verify-ui.mjs
          node scripts/test-explore-minimap-lifecycle.mjs
      - name: Commit generated facts and remove generator
        run: |
          git config user.name "Halifax Sourced Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/quality-gate.yml data/structured-place-facts.js data/build/structured-place-facts.json data/build/phase-e-generation.json
          git rm .github/workflows/phase-e-clean-generate.yml
          git commit -m "Generate reviewed structured first-party place facts"
          git push origin HEAD:phase-e-clean/structured-place-facts-20260828
