name: Deploy GitHub Pages (Gated)

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Record verified deployment SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          echo "Deploying Quality Gate verified SHA ${{ github.event.workflow_run.head_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact browser-tested release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: tested-site
          path: .release-site

      - name: Verify tested file hashes and deployment metadata
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/release-artifact.mjs verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .release-site

      - name: Wait for uploaded Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for delay in 0 1 2 4 8 15; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            if response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=${PAGES_ARTIFACT_NAME}")" \
              && jq -e --arg name "$PAGES_ARTIFACT_NAME" '.artifacts | any(.name == $name and (.expired | not))' <<<"$response" >/dev/null; then
              echo "Pages artifact ${PAGES_ARTIFACT_NAME} is visible."
              exit 0
            fi
            echo "Pages artifact ${PAGES_ARTIFACT_NAME} is not visible after ${delay}s; retrying within the bounded visibility window."
          done
          echo "Pages artifact ${PAGES_ARTIFACT_NAME} did not become visible within 30 seconds." >&2
          exit 1

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1200000
