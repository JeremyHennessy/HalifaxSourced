name: Deploy GitHub Pages (Gated)

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Record verified deployment SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          echo "Deploying Quality Gate verified SHA ${{ github.event.workflow_run.head_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact browser-tested release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: tested-site
          path: .release-site

      - name: Verify tested file hashes and deployment metadata
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/release-artifact.mjs verify

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .release-site

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
