name: Deploy GitHub Pages (Gated)

on:
  workflow_run:
    workflows:
      - Quality Gate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Record verified deployment SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
          echo "Deploying Quality Gate verified SHA ${{ github.event.workflow_run.head_sha }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build verified structured specials for deployment
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node scripts/import-public-special-source-leads.mjs
          node scripts/build-structured-specials.mjs
          node scripts/check-public-special-source-leads.mjs
          node scripts/check-structured-specials.mjs
          node scripts/check-restaurant-lifecycle.mjs
          node scripts/check-restaurant-media-rights.mjs
          node scripts/build-content-coverage-report.mjs
          node scripts/reconcile-structured-coverage.mjs
          node scripts/check-report-deployment-parity.mjs
          node scripts/render-content-coverage-report.mjs
          node scripts/build-content-quality-report.mjs
          node scripts/build-deployment-metadata.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
