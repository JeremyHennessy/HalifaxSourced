name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Collection belongs to preview workflows. Release builds use accepted inputs.
      THUMBNAIL_DISCOVERY_FETCH: "0"
      THUMBNAIL_IMAGE_PROBE: "0"
      THUMBNAIL_PROMOTION_APPLY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in app-*.js data/local-restaurant-policy.js scripts/*.mjs scripts/lib/*.mjs; do
            [ -e "$file" ] || continue
            node --check "$file"
          done

      - name: Run structured-special evidence regression
        run: node scripts/test-structured-specials-model.mjs

      - name: Test discovery URL state and reporting values
        run: |
          node scripts/test-home-carousel-layout.mjs
          node scripts/test-discovery-route-state.mjs
          node scripts/test-coverage-values.mjs
          node scripts/test-coverage-freshness.mjs
          node scripts/test-source-freshness.mjs
          node scripts/test-link-audit-freshness.mjs
          node scripts/test-link-access-holds.mjs
          node scripts/test-review-trust-contracts.mjs
          node scripts/test-event-title-categories.mjs
          node scripts/test-menu-pointer-audit.mjs
          node scripts/test-action-pointer-policy.mjs
          node scripts/test-bluenose-admin-pointers.mjs
          node scripts/test-action-pointer-coverage.mjs
          node scripts/test-reviewed-hours-refresh.mjs
          node scripts/test-structured-address-projection.mjs
          node scripts/test-structured-phone-projection.mjs
          node scripts/test-queen-street-contact.mjs

      - name: Test preview promotion contract and branch leases
        run: node scripts/test-preview-promotion.mjs

      - name: Run network-disabled source verifier startup regression
        run: |
          node scripts/test-source-verifier-startup.mjs
          node scripts/test-source-page-classification.mjs
          node scripts/test-practical-details-review.mjs

      - name: Test fixed-snapshot release isolation
        run: node scripts/test-release-source-isolation.mjs

      - name: Run source quarantine, local media and refresh regressions
        run: |
          node scripts/test-source-integrity.mjs
          node scripts/test-public-source-fetch.mjs
          node scripts/test-first-party-feed-safety.mjs
          node scripts/test-robots-policy.mjs
          node scripts/test-robots-policy-adapters.mjs
          node scripts/test-scheduled-source-guards.mjs
          node scripts/test-ns-food-inspection-refresh.mjs
          node scripts/test-inspection-location-matching.mjs
          node scripts/test-robots-redirect-guards.mjs
          node scripts/test-local-media-repair.mjs
          node scripts/test-media-reference-contract.mjs
          node scripts/test-media-reference-validation.mjs
          node scripts/test-thumbnail-observation-clocks.mjs
          node scripts/test-event-refresh-dedupe.mjs
          node scripts/test-canonical-event-dedupe.mjs
          node scripts/test-event-identity-continuity.mjs

      - name: Export reviewed catalog before dependent builds
        run: |
          node scripts/export-catalog.mjs

      - name: Validate accepted public-special and patio snapshots
        run: |
          node scripts/check-public-special-source-leads.mjs
          node scripts/check-patio-directory-facts.mjs

      - name: Build deterministic structured specials
        run: node scripts/build-structured-specials.mjs

      - name: Test reviewed identities and expiry
        run: node scripts/test-reviewed-corrections.mjs

      - name: Test update consistency and reviewed fact batch
        run: |
          node scripts/test-update-consistency.mjs
          node scripts/test-source-run-health.mjs
          node scripts/test-regional-discovery-scope.mjs
          node scripts/test-promotion-semantic-noop.mjs
          node scripts/test-preview-coordinator.mjs
          node scripts/test-reviewed-fact-batch.mjs
          node scripts/test-regional-restaurants.mjs
          node scripts/test-mainmap-lifecycle.mjs

      - name: Test source name decoding
        run: node scripts/test-dartmouth-directory-names.mjs

      - name: Test directory civic identity conflicts
        run: node scripts/test-place-source-location-conflicts.mjs

      - name: Resolve accepted directory candidates without collection
        run: |
          node scripts/resolve-place-candidates.mjs
          node scripts/check-place-source-resolution.mjs

      - name: Build recent post intelligence
        run: |
          node scripts/build-recent-social-posts.mjs
          node scripts/build-reviewed-social-posts.mjs

      - name: Build local restaurant catalog
        run: |
          node scripts/export-catalog.mjs
          node scripts/check-local-restaurant-policy.mjs

      - name: Build thumbnail candidates
        run: |
          node scripts/test-automatic-thumbnail-approval.mjs
          node scripts/build-thumbnail-candidates.mjs
          node scripts/approve-eligible-thumbnails.mjs
          node scripts/build-thumbnail-candidates.mjs

      - name: Run social platform sanitation regression
        run: |
          node scripts/test-social-platform-registry.mjs
          node scripts/test-social-fact-candidates.mjs

      - name: Validate directory data
        run: node scripts/validate-data.mjs

      - name: Check restaurant lifecycle
        run: node scripts/check-restaurant-lifecycle.mjs

      - name: Check data integrity
        run: node scripts/check-data-integrity.mjs

      - name: Check expanded sources
        run: node scripts/check-expanded-sources.mjs

      - name: Check thumbnail candidates
        run: node scripts/check-thumbnail-candidates.mjs

      - name: Check restaurant discovery
        run: node scripts/check-restaurant-discovery.mjs

      - name: Test lifecycle language
        run: node scripts/test-lifecycle-language.mjs

      - name: Check restaurant media rights
        run: node scripts/check-restaurant-media-rights.mjs

      - name: Check neighbourhood resolutions
        run: node scripts/check-neighbourhood-resolutions.mjs

      - name: Check city event additions
        run: node scripts/check-city-event-additions.mjs

      - name: Apply city event additions
        run: node scripts/apply-city-event-additions.mjs

      - name: Sanitize city events
        run: node scripts/sanitize-city-events.mjs

      - name: Test reviewed off-site event locations
        run: node scripts/test-reviewed-event-locations.mjs

      - name: Resolve city event entities
        run: node scripts/resolve-city-event-entities.mjs

      - name: Check city events
        run: node scripts/check-city-events.mjs

      - name: Check event entity resolution
        run: node scripts/check-event-entity-resolution.mjs

      - name: Check structured place facts
        run: node scripts/check-structured-place-facts.mjs

      - name: Check patio directory facts
        run: node scripts/check-patio-directory-facts.mjs

      - name: Check public special source leads
        run: node scripts/check-public-special-source-leads.mjs

      - name: Test hours state
        run: node scripts/test-hours-state.mjs

      - name: Test event date helpers
        run: node scripts/test-event-date-helpers.mjs

      - name: Check structured specials
        run: node scripts/check-structured-specials.mjs

      - name: Test city event source drift
        run: node scripts/test-city-event-source-drift.mjs

      - name: Check local restaurant policy
        run: node scripts/check-local-restaurant-policy.mjs

      - name: Check current official, social, menu and action links
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LINK_HEALTH_SCOPE: release
          LINK_HEALTH_LIMIT: 0
          LINK_HEALTH_TIMEOUT_MS: 4000
          LINK_HEALTH_CONCURRENCY: 16
        run: |
          node scripts/check-source-links.mjs
          node scripts/check-release-link-health.mjs

      - name: Build content coverage and quality reports
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/check-restaurant-lifecycle.mjs
          node scripts/build-content-coverage-report.mjs
          node scripts/build-thumbnail-coverage-report.mjs
          node scripts/plan-thumbnail-coverage-attack.mjs
          node scripts/reconcile-structured-coverage.mjs
          node scripts/check-report-deployment-parity.mjs
          node scripts/render-content-coverage-report.mjs
          node scripts/build-content-quality-report.mjs
          node scripts/report-missed-local-restaurants.mjs
          node scripts/build-deployment-metadata.mjs
          node scripts/build-update-ledger.mjs
          node scripts/check-regional-restaurant-coverage.mjs

      - name: Build SQLite database artifacts
        run: |
          python3 scripts/build-sqlite-db.py
          python3 scripts/test-sqlite-catalog.py

      - name: Test immutable release receipts
        run: node scripts/test-release-artifact.mjs

      - name: Test crawlable SEO pages and media rights
        run: node scripts/test-seo-pages.mjs

      - name: Package validated release
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/release-artifact.mjs build
          node scripts/release-artifact.mjs verify

      - name: Upload validated release for browser testing
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: .release-site/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-data-integrity
          path: |
            artifacts/source-link-health-report.json
            artifacts/source-access-diagnostics.jsonl
            artifacts/data-integrity-report.json
            artifacts/expanded-source-integrity-report.json
            data/build/thumbnail-auto-approval-report.json
            artifacts/thumbnail-candidates-report.json
            artifacts/thumbnail-coverage-report.json
            artifacts/thumbnail-promotion-plan.json
            artifacts/restaurant-discovery-report.json
            artifacts/place-source-resolution-report.json
            data/build/place-source-resolutions.json
            data/directory-restaurant-leads.js
            data/build/directory-restaurant-leads.json
            data/build/catalog.json
            data/build/restaurant-lifecycle-report.json
            docs/restaurant-lifecycle-report.md
            data/build/restaurant-media-rights-report.json
            data/build/neighbourhood-resolution-report.json
            artifacts/city-event-additions-report.json
            artifacts/city-event-integrity-report.json
            artifacts/event-entity-resolution-report.json
            artifacts/structured-place-facts-report.json
            artifacts/structured-specials-report.json
            artifacts/patio-directory-facts-report.json
            artifacts/public-special-source-leads-report.json
            data/build/event-entity-resolution.json
            data/build/structured-place-facts.json
            data/build/structured-specials.json
            data/structured-specials.js
            data/build/patio-directory-facts.json
            data/patio-directory-facts.js

            data/build/public-special-source-leads.json
            data/public-special-source-leads.js
            data/build/website-page-intelligence.json
            data/website-page-intelligence.js
            data/build/recent-social-posts.json
            data/recent-social-posts.js
            data/build/reviewed-social-posts.json
            data/reviewed-social-posts.js
            data/build/thumbnail-candidates.json
            data/thumbnail-candidates.js
            data/build/thumbnail-coverage-report.json
            data/build/thumbnail-promotion-plan.json
            data/build/thumbnail-promotion-plan.csv
            data/build/thumbnail-source-check-priority.csv
            docs/thumbnail-coverage-report.md
            docs/thumbnail-coverage-attack-plan.md
            data/build/halifax_sourced.sqlite
            data/build/content-coverage-report.json
            docs/content-coverage-report.md
            data/build/content-quality-report.json
            docs/content-quality-report.md
            artifacts/missed-local-restaurant-candidates.json
            data/build/deployment-metadata.json
            data/build/update-ledger.json
            data/build/regional-restaurant-coverage-report.json
          if-no-files-found: ignore

  ui-verification:
    needs: data-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the validated release
        uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: .release-site

      - name: Verify release receipt and use its data for assertions
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/release-artifact.mjs verify
          cp -a .release-site/data/. data/

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        env:
          APP_ROOT: ${{ github.workspace }}/.release-site
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1

      - name: Verify routes, map, search, responsive UI, and rich discovery
        env:
          APP_URL: http://127.0.0.1:5173
        run: |
          node scripts/verify-review-priorities.mjs
          node scripts/test-offer-rendering-fixed-clock.mjs
          node scripts/test-feed-image-controls.mjs
          node scripts/test-offline-resource-gate.mjs
          node scripts/test-popup-resource-gate.mjs
          node scripts/test-map-tile-controls.mjs
          node scripts/test-home-carousel-classic-scrollbar.mjs
          node scripts/verify-ui.mjs
          node scripts/verify-reviewed-corrections.mjs
          node scripts/verify-regional-restaurants.mjs
          node scripts/verify-admin-status.mjs
          node scripts/verify-iphone-links.mjs
          node scripts/test-action-pointer-navigation.mjs
          node scripts/test-bluenose-admin-navigation.mjs
          node scripts/test-queen-street-contact-navigation.mjs
          node scripts/test-source-freshness-navigation.mjs
          node scripts/test-explore-minimap-lifecycle.mjs
          node scripts/test-rich-discovery.mjs

      - name: Verify tested release is unchanged
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          QUALITY_WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: node scripts/release-artifact.mjs verify

      - name: Upload tested release for deployment
        uses: actions/upload-artifact@v4
        with:
          name: tested-site
          path: .release-site/
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-ui
          path: artifacts/
          if-no-files-found: ignore
