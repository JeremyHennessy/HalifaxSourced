name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          for file in app-*.js scripts/*.mjs; do
            node --check "$file"
          done

      - name: Run data integrity checks
        run: |
          node scripts/check-data-integrity.mjs
          node scripts/check-expanded-sources.mjs
          node scripts/check-restaurant-discovery.mjs
          node scripts/check-city-events.mjs

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-data-integrity
          path: |
            artifacts/data-integrity-report.json
            artifacts/expanded-source-integrity-report.json
            artifacts/restaurant-discovery-report.json
            artifacts/city-event-integrity-report.json
          if-no-files-found: ignore

  ui-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          node scripts/dev-server.mjs > /tmp/halifax-sourced-server.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/halifax-sourced-server.log
          exit 1

      - name: Verify routes, map, search, and responsive UI
        env:
          APP_URL: http://127.0.0.1:5173
        run: node scripts/verify-ui.mjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-ui
          path: artifacts/
          if-no-files-found: ignore
