name: City Events Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/city-events-preview.yml
      - data/reviewed-event-locations.json
      - scripts/lib/reviewed-event-locations.mjs
      - scripts/test-reviewed-event-locations.mjs
      - data/event-source-registry.json
      - data/event-source-supplements.json
      - data/event-source-candidates.json
      - data/venue-registry.json
      - data/organizer-registry.json
      - data/city-event-additions.js
      - data/build/city-event-additions.json
      - scripts/import-city-events.mjs
      - scripts/import-supplemental-city-events.mjs
      - scripts/apply-city-event-additions.mjs
      - scripts/check-city-event-additions.mjs
      - scripts/sanitize-city-events.mjs
      - scripts/reconcile-city-event-source-drift.mjs
      - scripts/event-source-drift-lib.mjs
      - scripts/test-city-event-source-drift.mjs
      - scripts/resolve-city-event-entities.mjs
      - scripts/check-event-entity-resolution.mjs
      - scripts/check-city-events.mjs
      - scripts/lib/canonical-event-dedupe.mjs
      - scripts/lib/event-refresh-safety.mjs
      - scripts/test-event-identity-continuity.mjs
      - scripts/check-event-identity-continuity.mjs
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/city-events-preview.yml
      - data/reviewed-event-locations.json
      - scripts/lib/reviewed-event-locations.mjs
      - scripts/test-reviewed-event-locations.mjs
      - data/event-source-registry.json
      - data/event-source-supplements.json
      - data/event-source-candidates.json
      - data/venue-registry.json
      - data/organizer-registry.json
      - data/city-event-additions.js
      - data/build/city-event-additions.json
      - scripts/import-city-events.mjs
      - scripts/import-supplemental-city-events.mjs
      - scripts/apply-city-event-additions.mjs
      - scripts/check-city-event-additions.mjs
      - scripts/sanitize-city-events.mjs
      - scripts/reconcile-city-event-source-drift.mjs
      - scripts/event-source-drift-lib.mjs
      - scripts/test-city-event-source-drift.mjs
      - scripts/resolve-city-event-entities.mjs
      - scripts/check-event-entity-resolution.mjs
      - scripts/check-city-events.mjs
      - scripts/lib/canonical-event-dedupe.mjs
      - scripts/lib/event-refresh-safety.mjs
      - scripts/test-event-identity-continuity.mjs
      - scripts/check-event-identity-continuity.mjs

permissions:
  contents: read

jobs:
  validate-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate event identity without source collection
        env:
          NODE_OPTIONS: --import ${{ github.workspace }}/scripts/lib/deny-source-network.mjs
        run: |
          node scripts/test-reviewed-event-locations.mjs
          node scripts/test-event-identity-continuity.mjs
          node scripts/test-event-refresh-safety.mjs
          node scripts/test-event-refresh-dedupe.mjs
          node scripts/test-canonical-event-dedupe.mjs
  refresh-events:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preserve previous validated city-event snapshot
        run: cp data/build/city-events.json /tmp/city-events.previous.json

      - name: Import Halifax-wide events
        env:
          CITY_EVENT_TIMEOUT_MS: 15000
        run: node scripts/import-city-events.mjs

      - name: Restrict primary sources to Halifax metro
        run: node scripts/sanitize-city-events.mjs

      - name: Add convention, symphony, and public-library events
        env:
          SUPPLEMENTAL_EVENT_TIMEOUT_MS: 15000
          LIBRARY_EVENT_PAGE_LIMIT: 120
          LIBRARY_EVENT_DELAY_MS: 100
        run: node scripts/import-supplemental-city-events.mjs

      - name: Validate curated city-event additions
        run: node scripts/check-city-event-additions.mjs

      - name: Apply curated city-event additions
        run: node scripts/apply-city-event-additions.mjs

      - name: Reconcile anomalous high-yield source drops
        env:
          CITY_EVENTS_PREVIOUS_PATH: /tmp/city-events.previous.json
          CITY_EVENT_ANOMALY_MIN_PRIOR_COUNT: 20
          CITY_EVENT_ANOMALY_MAX_SNAPSHOT_AGE_DAYS: 3
          CITY_EVENT_ANOMALY_CARRY_DAYS: 7
        run: node scripts/reconcile-city-event-source-drift.mjs

      - name: Recheck event scope and normalize categories
        run: node scripts/sanitize-city-events.mjs

      - name: Resolve event venues and organizers
        run: node scripts/resolve-city-event-entities.mjs

      - name: Validate city event dataset
        run: node scripts/check-city-events.mjs

      - name: Validate event entity resolution
        run: node scripts/check-event-entity-resolution.mjs

      - name: Verify saved-event continuity before preview upload
        run: |
          node scripts/check-event-identity-continuity.mjs /tmp/city-events.previous.json
          node scripts/test-reviewed-event-locations.mjs
          node scripts/test-event-identity-continuity.mjs
          node scripts/test-canonical-event-dedupe.mjs

      - name: Upload city event preview
        uses: actions/upload-artifact@v4
        with:
          name: city-events-preview
          path: |
            data/city-events.js
            data/build/city-events.json
            data/build/event-entity-resolution.json
            artifacts/city-event-source-drift-report.json
            artifacts/city-event-integrity-report.json
            artifacts/event-entity-resolution-report.json
            artifacts/city-event-additions-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve event refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-events-refresh-diagnostics
          path: artifacts/city-event-source-drift-report.json
          if-no-files-found: warn
          retention-days: 30
