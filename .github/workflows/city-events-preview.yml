name: City Events Preview

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches:
      - events-social-expansion-20260828
    paths:
      - .github/workflows/city-events-preview.yml
      - data/event-source-registry.json
      - scripts/import-city-events.mjs
      - scripts/check-city-events.mjs

permissions:
  contents: write

jobs:
  refresh-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import Halifax-wide events
        env:
          CITY_EVENT_TIMEOUT_MS: 15000
        run: node scripts/import-city-events.mjs

      - name: Validate city event dataset
        run: node scripts/check-city-events.mjs

      - name: Upload city event preview
        uses: actions/upload-artifact@v4
        with:
          name: city-events-preview
          path: |
            data/city-events.js
            data/build/city-events.json
            artifacts/city-event-integrity-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Capture validated event output on isolated branch
        if: github.ref == 'refs/heads/events-social-expansion-20260828'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/city-events.js data/build/city-events.json
          if git diff --cached --quiet; then
            echo "No city event output changes to commit."
            exit 0
          fi
          git commit -m "Refresh Halifax city event data"
          git fetch origin events-social-expansion-20260828
          git rebase origin/events-social-expansion-20260828
          git push origin HEAD:events-social-expansion-20260828
